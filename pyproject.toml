[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gigbid-portfolio"
version = "1.0.0"
description = "Evidence-grounded freelancer copilot and standalone Portfolio MCP server"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.163.0", "uvicorn==0.34.2", "pydantic==2.14.3",
  "starlette==1.3.1",
  "pydantic-settings==2.16.3", "sqlalchemy==2.0.40", "psycopg[binary,pool]==3.2.9",
  "langgraph==1.2.22", "langgraph-prebuilt==1.1.2", "langgraph-checkpoint-postgres==3.2.1",
  "langgraph-checkpoint-sqlite==3.1.3", "langchain-mcp-adapters==0.3.2",
  "aiosqlite==0.21.0", "langchain-core==1.8.0", "langgraph-checkpoint==4.3.2", "langgraph-sdk==0.4.14", "pillow==13.0.0",
  "langchain-openai==1.8.0", "langgraph-supervisor==0.0.31", "mcp==1.30.0",
  "httpx==0.28.1", "python-dotenv==1.2.4", "pyyaml==6.0.2",
  "cryptography==50.0.2", "PyJWT==2.15.1", "argon2-cffi==23.1.0",
  "python-multipart==0.0.33", "arq==0.26.3", "redis==5.2.1",
  "numpy==2.2.6", "rank-bm25==0.2.2", "pypdf==7.1.0",
  "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.11.10", "reportlab==4.4.1", "matplotlib==3.10.3"]
retrieval = ["fastembed==0.9.1", "flashrank==0.2.10", "qdrant-client==1.20.0"]

[project.scripts]
gigbid-portfolio = "mcp_servers.portfolio.server:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "apps", "rag", "mcp_servers", "worker", "gigbid_core", "simulator"]
exclude = ["apps/web/**", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "mcp_servers/portfolio/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".cache", ".venv", "node_modules", "dist", "data", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]
